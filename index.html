<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="heading">
        <h1> GUESS THE NUMBER</h1>
        <h1>Guess the number between 1-25</h1>
    </div>
    <div class="maindiv">
        <div>
            <div class="boxes">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
            </div>
            <div class="boxes">
                <div class="box">6</div>
                <div class="box">7</div>
                <div class="box">8</div>
                <div class="box">9</div>
                <div class="box">10</div>
            </div>
            <div class="boxes">

                <div class="box">11</div>
                <div class="box">12</div>
                <div class="box">13</div>
                <div class="box">14</div>
                <div class="box">15</div>
            </div>
            <div class="boxes">

                <div class="box">16</div>
                <div class="box">17</div>
                <div class="box">18</div>
                <div class="box">19</div>
                <div class="box">20</div>
            </div>
            <div class="boxes">

                <div class="box">21</div>
                <div class="box">22</div>
                <div class="box">23</div>
                <div class="box">24</div>
                <div class="box">25</div>
            </div>
        </div>
        <!-- boxes over -->
        <div class="inst">
            <h1>Select a number from the given boxes</h1>
            <div class="score">Score : <h5>25</h5></div>
            <div class="score bestscore">Best : <h5>0</h5>
            </div>
        </div>
    </div>
    <div class="hint"> <h2>Hint :  </h2> <h3 class="hinttext"> Start to get a hint </h3></div>
    <script src="script.js"></script>
</body>

</html>
